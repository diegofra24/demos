<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador solicitud VPN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: engineering datasheet, calm and exact
   IDEA: a process engine console — the BPMN drawing is the live picture
   PICTURE: the VPN process diagram with a moving token and lit paths
   COLOUR and TYPE: cobalt strip, white field, black ink; Space Grotesk + Inter
   LAYOUT: title strip, diagram band, then task form beside variables and log */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0a0d18);--ink:light-dark(#0b0f1a,#e8ecf8);--mut:light-dark(#5a6275,#9aa3bb);--zone:light-dark(#eef2ff,#141a2e);--line:light-dark(#c9d2ea,#2a3352);--co:#1240e0;--co2:light-dark(#1240e0,#5b7cff);--ok:light-dark(#0f7a3d,#4cd38a);--no:light-dark(#b4232a,#ff7a7f);--node:light-dark(#ffffff,#10152a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:"Space Grotesk",Inter,sans-serif;font-weight:600;line-height:1.05;text-wrap:balance;margin:0}
.strip{background:var(--co);color:#fff;padding:22px max(5vw,16px) 20px}
.strip h1{font-size:clamp(26px,4vw,40px)}
.strip p{margin:8px 0 0;max-width:68ch;opacity:.9}
.band{padding:clamp(20px,3vw,40px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
.diagram{background:var(--zone);border-block:1px solid var(--line)}
.scroll{overflow-x:auto}
svg.bp{display:block;width:100%;min-width:780px;height:auto}
.n rect,.n circle,.n path.d{fill:var(--node);stroke:var(--line);stroke-width:2;transition:fill .25s,stroke .25s}
.n text{font:600 12.5px Inter,sans-serif;fill:var(--ink)}
.n .role{font:500 10.5px Inter,sans-serif;fill:var(--mut)}
.n.done rect,.n.done circle,.n.done path.d{stroke:var(--co2);fill:light-dark(#dfe6ff,#1b2550)}
.n.on rect,.n.on circle,.n.on path.d{stroke:var(--co2);stroke-width:3.5;fill:light-dark(#c9d5ff,#22307a)}
.n.on rect{animation:pulse 1.2s ease-in-out infinite}
.n.endok.done circle{stroke:var(--ok);stroke-width:4}.n.endno.done circle{stroke:var(--no);stroke-width:4}
.e{fill:none;stroke:var(--mut);stroke-width:2;marker-end:url(#arr)}
.e.taken{stroke:var(--co2);stroke-width:3.5;marker-end:url(#arr2)}
.el{font:600 11.5px Inter,sans-serif;fill:var(--mut)}
@keyframes pulse{50%{stroke-width:6}}
@media(prefers-reduced-motion:reduce){.n.on rect{animation:none}*{transition:none!important}}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--line);border-radius:10px;padding:20px;background:var(--bg)}
.panel h2{font-size:22px;margin-bottom:4px}
.who{display:inline-block;font-size:13px;font-weight:600;color:#fff;background:var(--co);border-radius:999px;padding:3px 10px;margin:6px 0 14px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;font:16px Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--node);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--co2);outline-offset:1px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
@media(max-width:600px){.row{grid-template-columns:minmax(0,1fr)}}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
button{min-height:44px;padding:0 18px;font:600 15px Inter,sans-serif;border-radius:8px;border:1px solid var(--line);background:var(--node);color:var(--ink);cursor:pointer}
button.pri{background:var(--co);border-color:var(--co);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.no{background:var(--no);border-color:var(--no);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.presets span{font-size:14px;color:var(--mut);margin-right:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--mut);width:46%;padding-right:10px}
td:last-child{font-weight:500;overflow-wrap:anywhere}
.log{list-style:none;margin:0;padding:0;font-size:14px;max-height:260px;overflow:auto}
.log li{padding:7px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:2.2em minmax(0,1fr)}
.log b{color:var(--co2)}
.result{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:600;margin:6px 0 8px}
.result.ok{color:var(--ok)}.result.no{color:var(--no)}
.note{font-size:13px;color:var(--mut);margin-top:12px}
.side{display:grid;gap:24px;align-content:start}
</style>
</head>
<body>
<header class="strip"><div class="wrap">
<h1>Solicitud de acceso VPN: simulador del proceso</h1>
<p>Haz de cada rol, completa las tareas y mira cómo avanza el token por el diagrama. Es el mismo flujo del archivo solicitud-vpn.bpmn.</p>
</div></header>

<section class="diagram"><div class="wrap scroll" style="padding:16px max(2vw,8px)">
<svg class="bp" id="bp" viewBox="30 70 1160 290" role="img" aria-label="Diagrama del proceso de solicitud VPN"></svg>
</div></section>

<section class="band"><div class="grid">
<div>
<div class="presets"><span>Escenarios automáticos:</span>
<button id="pA">Aprobado completo</button><button id="pB">Jefe rechaza</button><button id="pC">Seguridad rechaza</button>
</div>
<div class="panel" id="task"></div>
</div>
<div class="side">
<div class="panel"><h2>Variables del proceso</h2><p class="sub">Lo que guardaría el motor (KIE Server) en cada instancia.</p><table id="vars"></table></div>
<div class="panel"><h2>Bitácora</h2><ol class="log" id="log"></ol></div>
</div>
</div></section>

<script>
{
const N={
 StartEvent_1:{t:'start',x:50,y:122,w:56,h:56,l:'Solicitud radicada'},
 Task_AprobarJefe:{t:'task',x:150,y:110,w:160,h:80,l:'Aprobar solicitud',r:'Jefe inmediato'},
 GW_Jefe:{t:'gw',x:350,y:125,w:50,h:50,l:'¿Aprobó el jefe?'},
 Task_ValidarSeguridad:{t:'task',x:440,y:110,w:160,h:80,l:'Validar riesgo',r:'Seguridad de la Inf.'},
 GW_Seguridad:{t:'gw',x:640,y:125,w:50,h:50,l:'¿Riesgo aceptable?'},
 Task_ConfigurarVpn:{t:'task',x:730,y:110,w:160,h:80,l:'Configurar VPN',r:'Infraestructura'},
 Script_NotificarOk:{t:'script',x:930,y:110,w:140,h:80,l:'Notificar acceso',r:'Sistema'},
 End_Otorgado:{t:'end',c:'endok',x:1110,y:122,w:56,h:56,l:'Acceso otorgado'},
 GW_MergeRechazo:{t:'gw',x:640,y:275,w:50,h:50,l:''},
 Script_NotificarRechazo:{t:'script',x:730,y:260,w:160,h:80,l:'Notificar rechazo',r:'Sistema'},
 End_Rechazado:{t:'end',c:'endno',x:930,y:272,w:56,h:56,l:'Solicitud rechazada'}};
const E={F1:[[106,150],[150,150]],F2:[[310,150],[350,150]],F3_Si:[[400,150],[440,150],'Sí'],F3_No:[[375,175],[375,300],[640,300],'No'],
 F4:[[600,150],[640,150]],F5_Si:[[690,150],[730,150],'Sí'],F5_No:[[665,175],[665,275],'No'],F6:[[890,150],[930,150]],F7:[[1070,150],[1110,150]],F8:[[690,300],[730,300]],F9:[[890,300],[930,300]]};
const svg=document.getElementById('bp');
const pts=a=>a.filter(p=>Array.isArray(p));
let h='<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--mut)"/></marker><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--co2)"/></marker></defs>';
h+=Object.entries(E).map(([id,a])=>{const p=pts(a);const lab=typeof a[a.length-1]==='string'?a[a.length-1]:'';const m=p[1];
 const lx=id==='F3_No'?382:id==='F5_No'?672:p[0][0]+6;const ly=id==='F3_No'?240:id==='F5_No'?228:138;
 return `<path class="e" id="e_${id}" d="M${p.map(q=>q.join(' ')).join(' L')}"/>`+(lab?`<text class="el" x="${lx}" y="${ly}">${lab}</text>`:'')}).join('');
h+=Object.entries(N).map(([id,n])=>{const cx=n.x+n.w/2,cy=n.y+n.h/2;let s='';
 if(n.t==='task'||n.t==='script')s=`<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10"/>`+`<text class="role" x="${n.x+10}" y="${n.y+18}">${n.t==='script'?'automática':'tarea humana'}</text>`+`<text x="${cx}" y="${cy+4}" text-anchor="middle">${n.l}</text><text class="role" x="${cx}" y="${cy+22}" text-anchor="middle">${n.r}</text>`;
 else if(n.t==='gw')s=`<path class="d" d="M${cx} ${n.y}L${n.x+n.w} ${cy}L${cx} ${n.y+n.h}L${n.x} ${cy}Z"/><text x="${cx}" y="${cy+5}" text-anchor="middle" style="font-size:18px">×</text>`+(n.l?`<text class="role" x="${cx}" y="${n.y-8}" text-anchor="middle">${n.l}</text>`:'');
 else s=`<circle cx="${cx}" cy="${cy}" r="${n.w/2-(n.t==='end'?2:0)}" style="${n.t==='end'?'stroke-width:4':''}"/><text class="role" x="${cx}" y="${n.y+n.h+18}" text-anchor="middle">${n.l}</text>`;
 return `<g class="n ${n.c||''}" id="n_${id}">${s}</g>`}).join('');
svg.innerHTML=h;

const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));
let vars={},step=0,run=0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const log=t=>{step++;$('log').insertAdjacentHTML('beforeend',`<li><b>${step}</b><span>${t}</span></li>`);$('log').scrollTop=1e6};
const showVars=()=>{const k=Object.keys(vars);$('vars').innerHTML=k.length?k.map(x=>`<tr><td>${x}</td><td>${esc(vars[x])}</td></tr>`).join(''):'<tr><td colspan="2">Sin instancia activa.</td></tr>'};
const cls=(id,c,on=true)=>$('n_'+id).classList.toggle(c,on);
const take=f=>$('e_'+f).classList.add('taken');
async function pass(id,f){cls(id,'on');await wait(450);cls(id,'on',false);cls(id,'done');if(f){take(f);await wait(250)}}
function reset(){run++;vars={};step=0;$('log').innerHTML='';document.querySelectorAll('.n').forEach(g=>g.classList.remove('on','done'));document.querySelectorAll('.e').forEach(e=>e.classList.remove('taken'));showVars();formStart()}

const sample={solicitante:'Laura Gómez',correoSolicitante:'laura.gomez@minjusticia.gov.co',dependencia:'Dirección Jurídica',jefeInmediato:'carlos.rojas',tipoVinculacion:'Contratista',justificacion:'Trabajo remoto dos días por semana para revisión de expedientes.',recursosRequeridos:'Sistema de gestión documental, carpeta compartida jurídica',fechaFinAcceso:'2027-06-30'};
const field=(k,l,v,type='text')=>`<label for="f_${k}">${l}</label>`+(type==='area'?`<textarea id="f_${k}">${esc(v)}</textarea>`:type==='sel'?`<select id="f_${k}">${v.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f_${k}" type="${type}" value="${esc(v)}">`);
const val=k=>$('f_'+k).value.trim();

function formStart(){$('task').innerHTML=`<h2>Radicar solicitud</h2><span class="who">Solicitante</span><p class="sub">Datos de ejemplo precargados; cámbialos si quieres.</p>
<div class="row">${field('solicitante','Nombre',sample.solicitante)}${field('correoSolicitante','Correo',sample.correoSolicitante,'email')}</div>
<div class="row">${field('dependencia','Dependencia',sample.dependencia)}${field('jefeInmediato','Usuario del jefe inmediato',sample.jefeInmediato)}</div>
<div class="row">${field('tipoVinculacion','Tipo de vinculación',['Contratista','Planta','Tercero / proveedor'],'sel')}${field('fechaFinAcceso','Acceso hasta',sample.fechaFinAcceso,'date')}</div>
${field('justificacion','Justificación',sample.justificacion,'area')}${field('recursosRequeridos','Recursos requeridos',sample.recursosRequeridos)}
<div class="btns"><button class="pri" id="go">Iniciar proceso</button></div>`;
$('go').onclick=async()=>{const r=run;Object.keys(sample).forEach(k=>vars[k]=val(k));vars.estado='EN_TRAMITE';showVars();log('Instancia creada: <b>minjusticia.solicitud-vpn</b>');await pass('StartEvent_1','F1');if(r===run)taskJefe()}}

function decide(title,who,sub,fields,onDone){
 $('task').innerHTML=`<h2>${title}</h2><span class="who">${who}</span><p class="sub">${sub}</p>${fields}<div class="btns"><button class="ok" id="si">Aprobar</button><button class="no" id="nope">Rechazar</button></div>`;
 $('si').onclick=()=>onDone(true);$('nope').onclick=()=>onDone(false)}

function taskJefe(){cls('Task_AprobarJefe','on');log(`Tarea creada para <b>${esc(vars.jefeInmediato)}</b>: Aprobar solicitud`);
 decide('Aprobar solicitud','Jefe inmediato · '+esc(vars.jefeInmediato),`${esc(vars.solicitante)} pide VPN hasta ${esc(vars.fechaFinAcceso)}: “${esc(vars.justificacion)}”`,field('comentarioJefe','Comentario','','area'),async ok=>{const r=run;
  vars.aprobadoJefe=ok;vars.comentarioJefe=val('comentarioJefe')||(ok?'Aprobado':'No justificado');showVars();cls('Task_AprobarJefe','on',false);cls('Task_AprobarJefe','done');log(`Jefe ${ok?'aprueba':'rechaza'}`);take('F2');await wait(250);
  await pass('GW_Jefe',ok?'F3_Si':'F3_No');if(r!==run)return;ok?taskSeg():rechazo('F3_No')})}

function taskSeg(){cls('Task_ValidarSeguridad','on');log('Tarea creada para el grupo <b>seguridad-informacion</b>');
 decide('Validar riesgo','Seguridad de la Información',`Vinculación: ${esc(vars.tipoVinculacion)} · Recursos: ${esc(vars.recursosRequeridos)}`,
  field('perfilVpn','Perfil VPN',['Básico (intranet)','Jurídico (gestión documental)','Administrador (restringido)'],'sel')+field('comentarioSeguridad','Concepto de riesgo','','area'),async ok=>{const r=run;
  vars.aprobadoSeguridad=ok;vars.perfilVpn=val('perfilVpn');vars.comentarioSeguridad=val('comentarioSeguridad')||(ok?'Riesgo aceptable':'Riesgo no aceptable');showVars();cls('Task_ValidarSeguridad','on',false);cls('Task_ValidarSeguridad','done');log(`Seguridad ${ok?'aprueba con perfil '+esc(vars.perfilVpn):'rechaza'}`);take('F4');await wait(250);
  await pass('GW_Seguridad',ok?'F5_Si':'F5_No');if(r!==run)return;ok?taskInfra():rechazo('F5_No')})}

function taskInfra(){cls('Task_ConfigurarVpn','on');log('Tarea creada para el grupo <b>infraestructura</b>');
 const u='vpn.'+(vars.solicitante||'usuario').toLowerCase().normalize('NFD').replace(/[^a-z ]/g,'').trim().replace(/\s+/g,'.');
 $('task').innerHTML=`<h2>Crear y configurar acceso VPN</h2><span class="who">Infraestructura</span><p class="sub">Perfil autorizado: ${esc(vars.perfilVpn)} · vigente hasta ${esc(vars.fechaFinAcceso)}</p>${field('usuarioVpn','Usuario VPN creado',u)}<div class="btns"><button class="pri" id="done">Marcar como configurado</button></div>`;
 $('done').onclick=async()=>{const r=run;vars.usuarioVpn=val('usuarioVpn');showVars();cls('Task_ConfigurarVpn','on',false);cls('Task_ConfigurarVpn','done');log(`Infraestructura crea el usuario <b>${esc(vars.usuarioVpn)}</b>`);take('F6');await wait(250);
  await pass('Script_NotificarOk','F7');if(r!==run)return;vars.estado='OTORGADO';showVars();log(`Correo enviado a ${esc(vars.correoSolicitante)} con el acceso`);await pass('End_Otorgado');fin(true)}}

async function rechazo(f){const r=run;await pass('GW_MergeRechazo','F8');await pass('Script_NotificarRechazo','F9');if(r!==run)return;vars.estado='RECHAZADO';showVars();log(`Correo de rechazo a ${esc(vars.correoSolicitante)}`);await pass('End_Rechazado');fin(false)}

function fin(ok){log('Instancia finalizada');$('task').innerHTML=`<h2>Instancia finalizada</h2><p class="result ${ok?'ok':'no'}">${ok?'Acceso VPN otorgado':'Solicitud rechazada'}</p><p class="sub">${ok?`Usuario ${esc(vars.usuarioVpn)}, perfil ${esc(vars.perfilVpn)}.`:'Motivo: '+esc(vars.comentarioSeguridad||vars.comentarioJefe)}</p><div class="btns"><button class="pri" id="again">Nueva solicitud</button></div><p class="note">En el motor real este cierre queda en el historial de auditoría de la instancia.</p>`;$('again').onclick=reset}

async function auto(a,b){reset();const r=run;await wait(200);$('go').click();await wait(900);if(r!==run)return;$(a?'si':'nope').click();if(!a)return;await wait(1300);if(r!==run)return;$(b?'si':'nope').click();if(!b)return;await wait(1300);if(r!==run)return;$('done').click()}
$('pA').onclick=()=>auto(true,true);$('pB').onclick=()=>auto(false);$('pC').onclick=()=>auto(true,false);
reset();
}
</script>
</body>
</html>
